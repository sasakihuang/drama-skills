<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>图文动效成片</title>
    <!-- 本地文件，不走 CDN：lib/ 由 animation.py setup 放好。 -->
    <script src="lib/gsap.min.js"></script>
    <style>
      /* 字体就地声明。思源黑体和马善政毛笔体都是 OFL，可商用。400、500 两档细的给风格片用。 */
      @font-face { font-family: "Noto Sans SC"; font-weight: 400;
        src: url("lib/fonts/noto-sans-sc-chinese-simplified-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 500;
        src: url("lib/fonts/noto-sans-sc-chinese-simplified-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 700;
        src: url("lib/fonts/noto-sans-sc-chinese-simplified-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("lib/fonts/noto-sans-sc-chinese-simplified-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Ma Shan Zheng"; font-weight: 400;
        src: url("lib/fonts/ma-shan-zheng-chinese-simplified-400-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050607; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
        color: var(--text); font-family: var(--body); font-weight: 700; }
      #root b { color: var(--key); font-weight: inherit; }
      .mk-fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .mk-backdrop { background: radial-gradient(ellipse at 50% 40%, var(--panel) 0%, var(--bg) 72%); }
      .mk-gridline { position: absolute; left: 5%; width: 90%; height: 1px; background: var(--grid); }
      .mk-scene { transform-origin: 50% 50%; }
      .mk-flash { background: radial-gradient(circle at 50% 42%, rgba(255, 200, 80, 0.55), rgba(0, 0, 0, 0) 60%); }
      /* Lines break evenly, so a heading never leaves one character alone on its last line. */
      .mk-header, .mk-card-title, .mk-card-body, .mk-statement, .mk-caption, .mk-center, .mk-end-text,
      .mk-number-label { text-wrap: balance; }
      .mk-header { position: absolute; font-weight: 900; line-height: 1.2; }
      .mk-title { position: absolute; left: 0; width: 100%; text-align: center; font-family: var(--display);
        font-weight: 400; color: var(--key); line-height: 1.25;
        text-shadow: 0 0 30px rgba(255, 170, 40, 0.85), 0 0 90px rgba(255, 120, 20, 0.55); }
      #root .mk-title b { color: var(--text); }
      .mk-title-sub { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 900; }
      .mk-spark { position: absolute; width: 8px; height: 8px; border-radius: 4px; background: #ffb347;
        box-shadow: 0 0 12px #ff8a00; }
      .mk-candle, .mk-wick, .mk-vol { position: absolute; display: block; }
      .mk-candle { border-radius: 3px; }
      .mk-wick { border-radius: 2px; }
      .mk-vol { border-radius: 2px 2px 0 0; opacity: 0.85; }
      .mk-up { background: var(--up); }
      .mk-down { background: var(--down); }
      .mk-line { position: absolute; transform-origin: 0 50%; background: var(--key); border-radius: 2px;
        box-shadow: 0 0 18px rgba(255, 210, 63, 0.7); }
      .mk-tag { position: absolute; white-space: nowrap; font-weight: 900; color: var(--key); line-height: 1.2;
        padding: 0 0.3em; border-radius: 0.2em; background: rgba(5, 6, 7, 0.66); text-shadow: 0 2px 10px #000; }
      .mk-zone { position: absolute; transform-origin: 0 50%; background: rgba(255, 210, 63, 0.13);
        border-top: 3px solid var(--key); border-bottom: 3px solid var(--key); }
      .mk-frame { position: absolute; border-radius: 18px; border: 5px solid var(--key);
        box-shadow: 0 0 40px rgba(255, 210, 63, 0.6), inset 0 0 30px rgba(255, 210, 63, 0.22); }
      .mk-ring { position: absolute; border-radius: 50%; border: 5px solid var(--key);
        box-shadow: 0 0 40px rgba(255, 210, 63, 0.8), inset 0 0 30px rgba(255, 210, 63, 0.4); }
      .mk-note { position: absolute; font-family: var(--display); font-weight: 400; line-height: 1.15;
        white-space: nowrap; padding: 0.12em 0.32em; border-radius: 0.16em; background: rgba(5, 6, 7, 0.78);
        text-shadow: 0 0 2px #000, 0 4px 18px rgba(0, 0, 0, 0.9); }
      .mk-center { text-align: center; white-space: normal; }
      .mk-arrow { position: absolute; height: 6px; transform-origin: 0 50%; background: var(--key);
        border-radius: 3px; box-shadow: 0 0 14px rgba(255, 210, 63, 0.8); }
      .mk-glint { position: absolute; left: 0; top: 0; width: 100%; text-shadow: none; -webkit-background-clip: text; background-clip: text; background-repeat: no-repeat;
        background-size: 300% 100%;
        background-image: linear-gradient(100deg, rgba(255, 255, 255, 0) 43%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 255, 255, 0) 57%); }
      #root .mk-glint, #root .mk-glint b { color: transparent; }
      .mk-view { position: absolute; left: 0; width: 100%; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, #000 4%, #000 96%, rgba(0, 0, 0, 0) 100%);
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, #000 4%, #000 96%, rgba(0, 0, 0, 0) 100%); }
      .mk-sweep { position: absolute;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0));
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 24%, #000 76%, rgba(0, 0, 0, 0));
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 24%, #000 76%, rgba(0, 0, 0, 0)); }
      .mk-card { position: absolute; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.16);
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03)); overflow: hidden; }
      .mk-card-no { position: absolute; font-family: var(--display); font-weight: 400; color: var(--key); line-height: 1; }
      .mk-card-text { position: absolute; display: flex; flex-direction: column; justify-content: center; }
      .mk-card-title { font-weight: 900; line-height: 1.25; }
      .mk-card-body { margin-top: 0.3em; line-height: 1.3; color: var(--dim); }
      .mk-number-row { position: absolute; left: 0; display: flex; justify-content: center; align-items: center; }
      .mk-number-affix { font-weight: 900; padding: 0 0.12em; }
      .mk-wheel { display: flex; overflow: hidden; font-weight: 900; color: var(--key); line-height: 1.1;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(255, 190, 60, 0.45); }
      .mk-wheel-col { overflow: hidden; }
      .mk-number-label { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 900; }
      .mk-number-note { position: absolute; left: 0; width: 100%; text-align: center; color: var(--dim); }
      .mk-bar { position: absolute; border-radius: 10px; background: rgba(245, 247, 250, 0.42); }
      .mk-bar-key { background: var(--key); box-shadow: 0 0 30px rgba(255, 210, 63, 0.45); }
      .mk-bar-label { position: absolute; white-space: nowrap; overflow: hidden; }
      .mk-bar-value { position: absolute; font-weight: 900; white-space: nowrap; }
      .mk-bar-value.mk-bar-key { background: none; box-shadow: none; color: var(--key); }
      .mk-panel { position: absolute; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.04); overflow: hidden; }
      .mk-panel-title { position: absolute; left: 4%; top: 3%; font-weight: 900; }
      .mk-verdict { position: absolute; right: 2.5%; top: 2%; font-family: var(--display); font-weight: 400; line-height: 1.15;
        padding: 0 0.28em; border: 4px solid; border-radius: 12px; background: rgba(5, 6, 7, 0.72); }
      .mk-good { color: var(--up); }
      .mk-bad { color: var(--down); }
      .mk-statement { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 900; line-height: 1.3;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
      .mk-end-text { position: absolute; left: 8%; width: 84%; text-align: center; font-weight: 900; line-height: 1.4; }
      .mk-badge { position: absolute; left: 0; width: 100%; text-align: center; color: var(--dim); }
      .mk-caption { position: absolute; left: 6%; width: 88%; text-align: center; font-weight: 900; line-height: 1.25;
        -webkit-text-stroke: 8px #000; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="20"></div>
    <!-- film.js 由 animation.py build 从 film.json 和 时间表.json 生成，不要手改。 -->
    <script src="film.js"></script>
    <script src="lib/kit.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.MotionKit.tl;
    </script>
  </body>
</html>
