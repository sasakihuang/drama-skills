<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>K 线讲解起步模板</title>
    <!-- 本地文件，不走 CDN：在本目录跑过 npm install 才有。 -->
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /* 字体就地声明（渲染器只认页面里写明的 @font-face）。都是 OFL，可商用。 */
      @font-face { font-family: "Noto Sans SC"; font-weight: 700;
        src: url("node_modules/@fontsource/noto-sans-sc/files/noto-sans-sc-chinese-simplified-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("node_modules/@fontsource/noto-sans-sc/files/noto-sans-sc-chinese-simplified-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Ma Shan Zheng"; font-weight: 400;
        src: url("node_modules/@fontsource/ma-shan-zheng/files/ma-shan-zheng-chinese-simplified-400-normal.woff2") format("woff2"); }
      /* 配色照原片的系统换：这里是黑底、红涨、青跌、黄色重点。 */
      :root {
        --bg: #050607;
        --up: #ff3b3b;
        --down: #2fe0d0;
        --key: #ffd23f;
        --text: #f5f7fa;
        --grid: rgba(255, 255, 255, 0.06);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #bg { background: radial-gradient(ellipse at 50% 40%, #11161c 0%, var(--bg) 70%); }
      /* 镜头：整张图放在 #cam 里，推近、平移都动它。 */
      #cam { transform-origin: 0 0; }
      .grid { position: absolute; left: 90px; width: 1740px; height: 1px; background: var(--grid); }
      .wick, .body, .vol { position: absolute; display: block; }
      .wick { width: 4px; border-radius: 2px; }
      .body { border-radius: 3px; }
      .vol { border-radius: 2px 2px 0 0; opacity: 0.85; }
      .up { background: var(--up); }
      .down { background: var(--down); }
      .line { position: absolute; height: 4px; display: block; transform-origin: 0 50%;
        background: var(--key); box-shadow: 0 0 18px rgba(255, 210, 63, 0.7); border-radius: 2px; }
      .ring { position: absolute; width: 150px; height: 150px; border-radius: 75px; display: block;
        border: 5px solid var(--key); box-shadow: 0 0 40px rgba(255, 210, 63, 0.8), inset 0 0 30px rgba(255, 210, 63, 0.4); }
      .note { position: absolute; display: block; font-family: "Ma Shan Zheng", "Noto Sans SC", sans-serif;
        font-size: 84px; line-height: 1.15; color: var(--text); white-space: nowrap;
        text-shadow: 0 0 2px #000, 0 4px 18px rgba(0, 0, 0, 0.9); }
      .note b { color: var(--key); font-weight: 400; }
      .arrow { position: absolute; height: 6px; display: block; background: var(--key);
        transform-origin: 0 50%; border-radius: 3px; box-shadow: 0 0 14px rgba(255, 210, 63, 0.8); }
      #title { position: absolute; left: 0; top: 330px; width: 1920px; display: block; text-align: center;
        font-family: "Ma Shan Zheng", "Noto Sans SC", serif; font-size: 230px; color: var(--key);
        text-shadow: 0 0 30px rgba(255, 170, 40, 0.85), 0 0 90px rgba(255, 120, 20, 0.55); }
      #flash { background: radial-gradient(circle at 50% 45%, rgba(255, 200, 80, 0.55), rgba(0, 0, 0, 0) 60%); }
      .spark { position: absolute; width: 8px; height: 8px; border-radius: 4px; display: block;
        background: #ffb347; box-shadow: 0 0 12px #ff8a00; }
      .sub { position: absolute; left: 160px; top: 948px; width: 1600px; display: block; text-align: center;
        font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 54px; color: var(--text);
        -webkit-text-stroke: 8px #000; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="9">
      <div id="bg" class="clip fill" data-start="0" data-duration="9" data-track-index="0"></div>
      <!-- 镜头层不是时间线片段，一直在场；里面的东西由时间线控制。 -->
      <div id="cam" class="fill">
        <div id="grid"></div>
        <div id="candles"></div>
        <div id="lines"></div>
      </div>
      <!-- 标注层不跟镜头缩放：推近以后按屏幕位置摆，字不会被推出画面。 -->
      <div id="marks" class="fill"></div>
      <div id="flash" class="clip fill" data-start="0" data-duration="1.6" data-track-index="2"></div>
      <div id="sparks" class="clip fill" data-start="0" data-duration="2.6" data-track-index="3"></div>
      <div id="title" class="clip" data-start="0" data-duration="2.2" data-track-index="4">换成新标题</div>
      <div id="s1" class="clip sub" data-start="1.6" data-duration="2.6" data-track-index="5">字幕一句一条，时间取自配音</div>
      <div id="s2" class="clip sub" data-start="4.2" data-duration="2.4" data-track-index="5">讲到哪根线，镜头就推到哪根线</div>
      <div id="s3" class="clip sub" data-start="6.6" data-duration="2.4" data-track-index="5">讲完拉回全图，接下一个动作</div>
    </div>
    <script>
      // ===== 1. 数据：示意数据，按讲解要的形状改。 [开, 高, 低, 收, 量] =====
      const DATA = [
        [10.2, 10.5, 9.9, 10.0, 40], [10.0, 10.3, 9.6, 9.7, 46], [9.7, 9.9, 9.3, 9.4, 52],
        [9.4, 9.8, 9.2, 9.7, 38], [9.7, 9.9, 9.4, 9.5, 35], [9.5, 9.8, 9.3, 9.6, 30],
        [9.6, 9.9, 9.4, 9.8, 33], [9.8, 10.0, 9.5, 9.6, 29], [9.6, 9.9, 9.45, 9.85, 34],
        [9.85, 11.4, 9.8, 10.05, 92], [10.1, 10.3, 9.9, 10.2, 41], [10.25, 10.6, 10.15, 10.55, 36],
        [10.55, 11.0, 10.45, 10.95, 58], [10.95, 11.6, 10.85, 11.5, 66]
      ];
      const KEY = 9;              // 要讲的那根线（从 0 数）
      const SUPPORT = 9.45;       // 要划的那条线的价格
      // ===== 2. 版面：主图占满画面，不套后台报表那种框。 =====
      const W = 1920, H = 1080, LEFT = 150, RIGHT = 1770, TOP = 120, BOTTOM = 700, VOL_TOP = 760, VOL_BOTTOM = 900;
      const lo = Math.min(...DATA.map(d => d[2])) - 0.2, hi = Math.max(...DATA.map(d => d[1])) + 0.2;
      const vmax = Math.max(...DATA.map(d => d[4]));
      const step = (RIGHT - LEFT) / DATA.length, bodyW = step * 0.56;
      const y = p => TOP + (hi - p) / (hi - lo) * (BOTTOM - TOP);
      const cx = i => LEFT + step * (i + 0.5);
      const el = (parent, cls, css, html) => {
        const node = document.createElement("div");
        node.className = cls;
        Object.assign(node.style, css);
        if (html) node.innerHTML = html;
        document.getElementById(parent).appendChild(node);
        return node;
      };
      for (let g = 0; g < 6; g++) el("grid", "grid", { top: TOP + g * (BOTTOM - TOP) / 5 + "px" });
      const parts = DATA.map(([o, h, l, c, v], i) => {
        const kind = c >= o ? "up" : "down";
        const top = y(Math.max(o, c)), bottom = y(Math.min(o, c));
        const body = el("candles", "body " + kind, {
          left: cx(i) - bodyW / 2 + "px", top: top + "px", width: bodyW + "px",
          height: Math.max(4, bottom - top) + "px",
          // 实体从开盘价往收盘价长：涨的从下往上，跌的从上往下。
          transformOrigin: kind === "up" ? "50% 100%" : "50% 0%"
        });
        const wick = el("candles", "wick " + kind, {
          left: cx(i) - 2 + "px", top: y(h) + "px", height: y(l) - y(h) + "px",
          transformOrigin: "50% " + (((top + bottom) / 2 - y(h)) / (y(l) - y(h)) * 100) + "%"
        });
        const vol = el("candles", "vol " + kind, {
          left: cx(i) - bodyW / 2 + "px", top: VOL_BOTTOM - v / vmax * (VOL_BOTTOM - VOL_TOP) + "px",
          width: bodyW + "px", height: v / vmax * (VOL_BOTTOM - VOL_TOP) + "px", transformOrigin: "50% 100%"
        });
        return { body, wick, vol, all: [body, wick, vol] };
      });
      const line = el("lines", "line", { left: LEFT + "px", top: y(SUPPORT) - 2 + "px", width: RIGHT - LEFT + "px" });
      // 推近后关键那根线在屏幕上的位置：横向放在 36% 处，右边留出写大字的地方。
      const zoom = 1.75, FOCUS_X = W * 0.36, FOCUS_Y = H * 0.5;
      const fx = cx(KEY), fy = (y(DATA[KEY][1]) + y(DATA[KEY][2])) / 2;
      const tipY = FOCUS_Y - zoom * (fy - y(DATA[KEY][1]));   // 上影线顶端
      const ring = el("marks", "ring", { left: FOCUS_X - 75 + "px", top: tipY - 30 + "px" });
      const arrow = el("marks", "arrow", { left: FOCUS_X + 85 + "px", top: tipY + 42 + "px", width: "140px" });
      const note = el("marks", "note", { left: FOCUS_X + 250 + "px", top: tipY - 8 + "px" },
        "冲上去<b>又被打回来</b>");
      // 火星：用固定种子的随机数，渲染每一帧都一样。
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const sparks = Array.from({ length: 26 }, () => el("sparks", "spark", { left: 960 + "px", top: 450 + "px" }));

      // ===== 3. 时间线：一段一个动作，时间取自这段配音的实际长度。 =====
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 开头 0–2 秒：标题砸下来 + 闪光 + 火星（配 impact / riser 音效）。
      tl.fromTo("#title", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power4.in" }, 0.05);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 0.48);
      tl.to("#flash", { opacity: 0, duration: 0.9, ease: "power2.out" }, 0.56);
      tl.fromTo("#title", { x: -10 }, { x: 0, duration: 0.3, ease: "elastic.out(1, 0.3)" }, 0.5);
      sparks.forEach((s, k) => {
        const a = rand() * Math.PI * 2, r = 260 + rand() * 520;
        tl.fromTo(s, { x: 0, y: 0, opacity: 1, scale: 0.6 + rand() },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.6, opacity: 0, duration: 1.2 + rand() * 0.8, ease: "power3.out" }, 0.5);
      });
      tl.to("#title", { y: -260, scale: 0.42, opacity: 0, duration: 0.5, ease: "power3.in" }, 1.6);
      // 1.7 秒起：K 线一根根长出来，量柱随后弹起（不是突然出现）。
      parts.forEach((p, i) => {
        const t = 1.7 + i * 0.13;
        tl.fromTo(p.body, { scaleY: 0 }, { scaleY: 1, duration: 0.28, ease: "power2.out" }, t);
        tl.fromTo(p.wick, { scaleY: 0 }, { scaleY: 1, duration: 0.32, ease: "power2.out" }, t + 0.1);
        tl.fromTo(p.vol, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.06);
      });
      // 讲到关键那根：其余变暗，镜头推近，光圈脉冲，大字标注带箭头弹出（配 whoosh + pop）。
      const focusAt = 4.3;
      parts.forEach((p, i) => { if (i !== KEY) tl.to(p.all, { opacity: 0.22, duration: 0.4 }, focusAt); });
      tl.to("#cam", { scale: zoom, x: FOCUS_X - zoom * fx, y: FOCUS_Y - zoom * fy, duration: 0.9, ease: "power3.inOut" }, focusAt);
      tl.fromTo(ring, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, focusAt + 0.7);
      tl.to(ring, { scale: 1.12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, focusAt + 1.15);
      tl.fromTo(arrow, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, focusAt + 0.9);
      tl.fromTo(note, { scale: 0.6, opacity: 0, x: -30 }, { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.8)" }, focusAt + 1.05);
      // 讲完拉回全图，再划一条线收尾。
      const backAt = 6.8;
      tl.to([ring, arrow, note], { opacity: 0, duration: 0.3 }, backAt);
      tl.to("#cam", { scale: 1, x: 0, y: 0, duration: 0.8, ease: "power3.inOut" }, backAt);
      parts.forEach(p => tl.to(p.all, { opacity: 1, duration: 0.4 }, backAt + 0.3));
      tl.fromTo(line, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, backAt + 0.7);
      // 字幕淡入淡出。
      [["#s1", 1.6, 2.6], ["#s2", 4.2, 2.4], ["#s3", 6.6, 2.4]].forEach(([s, a, d]) => {
        tl.fromTo(s, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.15 }, a);
        tl.to(s, { opacity: 0, duration: 0.12 }, a + d - 0.12);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
